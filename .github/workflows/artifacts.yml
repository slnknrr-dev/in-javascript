# ══════════════════════════════════════════════════════════════════════════
#  Artifacts: check  (README_FOR_DEVOPS.md)
#
#  GitHub counterpart of .forgejo/workflows/artifacts.yml.
#  GitHub is a mirror: the source of truth is Codeberg, so this workflow
#  only checks. There is no commit job here: artifacts are regenerated and
#  committed by the bot on Codeberg, and a push from GitHub would make the
#  mirror diverge from the origin.
#
#  On a pull request and on push to main: lint, `emit --check` with a
#  report file, then smoke on old engines.
#
#  The tooling is the flat set of downgrade*.js files in the repository root.
# ══════════════════════════════════════════════════════════════════════════

name: artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: structural invariants
        run: npm run lint

      # `--check` writes nothing: it compares what is in the repository with
      # what the build produces. Exit code 1 means the artifacts are stale.
      - name: artifacts match the sources
        id: emit
        run: npm run emit -- --check --report=build.md --why

      - name: summary into the job
        if: always()
        run: cat build.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: report as a file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build.md

  # An artifact was downgraded for old engines, so let those engines load it.
  # Unlike Forgejo, this job runs on the bare ubuntu runner (no container):
  # setup-node installs node 4/5/6 there without the old-glibc risk.
  smoke:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 4
            targets: es3@cjs,es5@cjs
          - node: 5
            targets: nodejs5@cjs
          - node: 6
            targets: es6@cjs
          - node: 13
            targets: es6@mjs,nodejs13@cjs
          - node: 18
            targets: nodejs18@cjs
          - node: 21
            targets: nodejs21@cjs,nodejs21@mjs
          - node: 24
            targets: es16@cjs,es16@mjs
    steps:
      - uses: actions/checkout@v4

      # the list is prepared by a modern node: downgrade-smoke.js is an
      # ES module, node 4 could not even parse it
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: what to load
        run: node downgrade-smoke.js --targets=${{ matrix.targets }} --list > files.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # and the loading is done by the engine the artifact was downgraded for
      - name: artifacts load on node ${{ matrix.node }}
        run: |
          node --version
          xargs -a files.txt -d '
          ' node downgrade-smoke-load.cjs
